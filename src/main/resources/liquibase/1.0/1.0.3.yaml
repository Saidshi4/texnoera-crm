databaseChangeLog:
  - changeSet:
      id: 19
      author: said4shi
      changes:
        - createTable:
            tableName: users_tasks
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: task_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: answer
                  type: text
                  constraints:
                    nullable: true
              - column:
                  name: answer_time
                  type: timestamp
                  constraints:
                    nullable: true
              - column:
                  name: grade
                  type: integer
                  constraints:
                    nullable: true
              - column:
                  name: status
                  type: varchar(255)
                  constraints:
                    nullable: false

  - changeSet:
      id: 20
      author: said4shi
      changes:
        - addForeignKeyConstraint:
            baseTableName: users_tasks
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_users_tasks_user

  - changeSet:
      id: 21
      author: said4shi
      changes:
        - addForeignKeyConstraint:
            baseTableName: users_tasks
            baseColumnNames: task_id
            referencedTableName: tasks
            referencedColumnNames: id
            constraintName: fk_users_tasks_task

  - changeSet:
      id: 22
      author: said4shi
      changes:
        - createTable:
            tableName: comments
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: text
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: author
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: task_entity_id
                  type: bigint
                  constraints:
                    nullable: false

  - changeSet:
      id: 23
      author: said4shi
      changes:
        - addForeignKeyConstraint:
            baseTableName: comments
            baseColumnNames: task_entity_id
            referencedTableName: users_tasks
            referencedColumnNames: id
            constraintName: fk_comments_task
