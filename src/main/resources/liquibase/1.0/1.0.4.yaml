databaseChangeLog:
  - changeSet:
      id: 24
      author: said4shi
      changes:
        - createTable:
            tableName: attendances
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_entity_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: group_entity_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: expected_attendance_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
                  constraints:
                    nullable: false

  - changeSet:
      id: 25
      author: said4shi
      changes:
        - addForeignKeyConstraint:
            baseTableName: attendances
            baseColumnNames: user_entity_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_attendance_user

        - addForeignKeyConstraint:
            baseTableName: attendances
            baseColumnNames: group_entity_id
            referencedTableName: groups
            referencedColumnNames: id
            constraintName: fk_attendance_group

